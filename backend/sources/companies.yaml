# Curated company job boards for board-JSON ingestion (P1).
#
# Every entry was verified against the live public API on the date noted:
# the token resolves on the stated board AND the org name / job locations
# confirm it is the intended (Canadian) company — several plausible slugs
# turned out to be unrelated US companies and were excluded.
#
# Boards and their public endpoints:
#   greenhouse: https://boards-api.greenhouse.io/v1/boards/{token}/jobs
#   lever:      https://api.lever.co/v0/postings/{token}?mode=json
#   ashby:      https://api.ashbyhq.com/posting-api/job-board/{token}
#
# Maintenance: run `uv run python -m sources.verify` (from backend/) to
# re-verify every token; it reports dead boards and job counts. Companies
# on Workday/SmartRecruiters/own portals (Shopify, Coveo, Arctic Wolf, ...)
# can't be listed here — they arrive via the Adzuna/Jooble aggregators.
#
# Review status: pending — Amaan reviews in the PR that introduces this file.
