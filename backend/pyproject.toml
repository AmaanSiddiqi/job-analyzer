[project]
name = "job-analyzer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "spacy>=3.8.2",
    "apscheduler>=3.10.4",
    "alembic>=1.13.2",
    "slowapi>=0.1.10",
    "pyyaml>=6.0.2",
    "pydantic-settings>=2.5",
    "anthropic>=0.116.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.2",
    "respx>=0.22",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
]
# The eval harness needs no extra packages now that `anthropic` is a runtime
# dependency (the extraction pipeline uses it). Kept as an empty extra so
# `uv sync --extra eval` in docs and CI keeps working.
eval = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# app/ and scraper/ both live at the repo root as separate top-level packages
# (services/scraper.py imports `from scraper import linkedin`) — setuptools'
# flat-layout auto-discovery refuses to guess between them, so list explicitly.
[tool.setuptools.packages.find]
include = ["app*", "scraper*", "eval*", "sources*", "taxonomy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
per-file-ignores = { "app/extraction/prompts.py" = ["E501"] }
ignore = [
    "E402",  # main.py configures logging before other imports on purpose;
             # alembic/env.py must load_dotenv() before importing app.database
             # (which reads DATABASE_URL at import time) — both deliberate.
    "B008",  # Depends()/Query() as argument defaults is FastAPI's own
             # required DI pattern, not the mutable-default footgun B008
             # is meant to catch.
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/versions/", ".venv/"]
