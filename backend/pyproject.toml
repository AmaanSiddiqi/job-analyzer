[project]
name = "job-analyzer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "spacy>=3.8.2",
    "apscheduler>=3.10.4",
    "alembic>=1.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# app/ and scraper/ both live at the repo root as separate top-level packages
# (services/scraper.py imports `from scraper import linkedin`) — setuptools'
# flat-layout auto-discovery refuses to guess between them, so list explicitly.
[tool.setuptools.packages.find]
include = ["app*", "scraper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
