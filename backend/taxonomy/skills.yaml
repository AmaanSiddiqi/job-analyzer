# Canonical skill taxonomy (P1). Seeded from the frozen baseline extractor's
# _SKILLS_VOCAB (app/services/nlp.py), then extended using the 150-listing
# eval gold set: that vocabulary covered only 33% of real skill mentions
# (106 of 1,116 distinct strings) and was missing sql, devops, observability,
# data modeling — which is precisely the baseline's 0.312 recall.
#
# Rules (CLAUDE.md):
#   * `id` is the canonical form stored on listings. Lowercase, stable —
#     renaming one is a data migration, so treat ids as an API.
#   * `aliases` are alternate spellings the extractor may emit. Matching is
#     case-insensitive and punctuation-insensitive (see taxonomy/config.py),
#     so "Node.js"/"nodejs"/"NODE JS" all resolve without separate entries.
#   * NO auto-expansion. Unmapped skills accumulate in the unmapped_skills
#     table for weekly review; adding an entry is a reviewed commit.
#   * Cap ~200 canonical ids. At the cap, prefer breadth of concept over
#     near-duplicate tools.
